spring.application.name=tienda


# Puerto en el que correrá la app Spring Boot
server.port=8080

# Conexión a la Base de Datos local en MySQL (Verifica si usas puerto 3306 o 3307)
spring.datasource.url=jdbc:mysql://localhost:3306/tiendaDianas?serverTimezone=UTC&useSSL=false
spring.datasource.username=root
spring.datasource.password=Erick1727@

# Estrategia de Hibernate: 'update' creará o actualizará las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Desactivar la caché de plantillas para desarrollo en vivo
spring.thymeleaf.cache=false
